[package]
name = "kbd-rgb"
version = "0.1.0"
edition = "2024"
description = "RGB keyboard control for System76 laptops"
license = "MIT"
repository = "https://github.com/jtibbertsma/kbd-rgb"

[dependencies]
clap = { version = "4.6.10", features = ["derive", "env"] }
evdev = "0.13.2"
glob = "0.3.4"
log = "0.4.35"
nix = { version = "0.29", features = ["signal", "user", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
thiserror = "2"
toml = "1.2.3"
wait-timeout = "0.2.1"

[dev-dependencies]
rstest = { version = "0.29", default-features = false }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# An item that other crates can't reach says `pub(crate)`, so `pub` always means "used by a binary".
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
# A panic is a bug. Aborting ends the whole daemon, so the kernel releases the keyboard grab and
# systemd restarts the service. Unwinding would only end the thread that panicked.
panic = "abort"
